<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Shop Perfumes || Login Page</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/all.css" />

</head>

<body>

    <header>
        <div class="container">

            <div class="header-content">
                <a href="index.html" class="brand">Shop Perfumes</a>

                <nav>
                    <ul id="links">
                        <li><a href="login.html"><button>Login</button></a></li>
                        <li><a href="register.html"><button class="btnregster">Register</button></a></li>
                    </ul>
                    <ul id="user_info">
                        <li><a href="#" id="user"></a></li>
                    </ul>
                </nav>
            </div>

        </div>
    </header>

    <section class="section-form">

        <form>
            <label>Email</label>
            <input type="email" placeholder="Enter email" id="email">
            <label>Password</label>
            <input type="password" placeholder="Enter password" id="password">
            <div class="checkbox-container">
                <input type="checkbox" id="remember">
                <label for="remember">remember me</label>
            </div>
            <input type="submit" value="login" id="sign_in">
            <p>Dont have account ? <a href="./register.html">register</a></p>
        </form>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
